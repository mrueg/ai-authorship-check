name: AI Authorship Check
description: Reacts to new issues, pull requests and comments with ❤️ (likely human), 👀 (undecided) or 🚀 (likely AI-generated), using a local classifier.
author: mrueg
branding:
  icon: user-check
  color: purple

inputs:
  github-token:
    description: Token used to add reactions and labels. Needs issues and pull-requests write access.
    default: ${{ github.token }}
  human-threshold:
    description: P(AI) below this value counts as likely human.
    default: "0.3"
  ai-threshold:
    description: P(AI) at or above this value counts as likely AI. Values between the two thresholds are undecided. Higher means fewer real people flagged as AI.
    default: "0.95"
  human-reaction:
    description: Reaction for likely human text. One of +1, -1, laugh, confused, heart, hooray, rocket, eyes, or none.
    default: heart
  undecided-reaction:
    description: Reaction when the model is undecided. One of +1, -1, laugh, confused, heart, hooray, rocket, eyes, or none.
    default: eyes
  ai-reaction:
    description: Reaction for likely AI-generated text. One of +1, -1, laugh, confused, heart, hooray, rocket, eyes, or none.
    default: rocket
  min-length:
    description: Skip texts shorter than this many characters after cleanup (quotes, code, templates removed).
    default: "40"
  max-tokens:
    description: Tokens per model input. Longer texts are truncated, or split into chunks of this size when long-text is chunks.
    default: "2048"
  long-text:
    description: How to handle texts longer than max-tokens. truncate reads only the beginning; chunks scores up to 4 chunks and averages them (slower on long texts).
    default: truncate
  skip-associations:
    description: Comma-separated author associations that are never judged (OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, NONE).
    default: OWNER,MEMBER
  signature-check:
    description: Treat the text as likely AI without running the model when it carries an explicit AI-tool signature ("Generated with Claude Code", AI Co-Authored-By trailers, ...).
    default: "true"
  add-label:
    description: Also add a label to issues and pull requests judged as AI (removed again if an edit flips the verdict).
    default: "false"
  label-name:
    description: Label used when add-label is true.
    default: possibly-ai-generated
  dry-run:
    description: Classify and set outputs, but do not react or label.
    default: "false"
  fail-on-error:
    description: Fail the job when adding a reaction or label fails (deleted comment, locked issue, read-only token on fork PRs). By default this only logs a warning.
    default: "false"

outputs:
  verdict:
    description: human, undecided, ai or skipped
  p-ai:
    description: Model probability that the text is AI-generated (1 for signature matches, empty when skipped)
  reason:
    description: Why this verdict was reached

runs:
  using: docker
  # Pinned by digest: the tag is for humans, the digest is what gets pulled.
  image: docker://ghcr.io/mrueg/ai-authorship-check:v0.1.0@sha256:537a2205c62b7db763b9364a65ceb2cec05de3dbb5cf510fd8f60106d8bc9470
