# The README's usage example, run on this repository with its own action (`./`),
# so every issue, pull request and comment here is a live test of main.
name: AI Authorship Check
on:
  issues:              { types: [opened, edited] }
  issue_comment:       { types: [created, edited] }
  pull_request_target: { types: [opened, edited] }

permissions:
  issues: write
  pull-requests: write
  contents: read
  packages: read # pull the action image while the package is private

concurrency:
  group: ai-authorship-check-${{ github.event.comment.id || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-authorship-check:
    runs-on: ubuntu-latest
    steps:
      # Checks out main, never the PR's code: pull_request_target and the issue
      # events always run on the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only needed while the repository (and so its image) is private.
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - uses: ./
        with:
          skip-associations: "" # judge everyone; the repo owner opens most PRs here
