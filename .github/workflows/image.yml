name: Publish image

# Builds the action image with the real model and pushes it to GHCR as
# ghcr.io/<repo>:<version>, then commits the digest-pinned image to action.yml on a
# branch and links a pull request for it. Run it by hand before tagging a release;
# see "Releasing" in the README. It never overwrites an existing version, and git
# tags don't trigger it, so tagging the release can't replace the image that
# action.yml pins.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish, e.g. v0.2.0
        required: true

permissions:
  contents: write # push the branch that pins the new image in action.yml
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest # 16 GB RAM: enough to export ModernBERT-large
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists; publish a new version instead"; exit 1
          fi
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha
      # Build into the local daemon and smoke-test before pushing: a failed test must not
      # leave a published version behind (the check above would then block re-publishing it).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test the image
        run: ./scripts/smoke.sh "$IMAGE:$VERSION"
      - id: push
        name: Push
        run: |
          docker push --all-tags "$IMAGE" | tee push.log
          # "vX.Y.Z: digest: sha256:… size: …" for the version tag.
          digest="$(grep -E "^$VERSION: digest: sha256:[0-9a-f]{64}" push.log | grep -oE 'sha256:[0-9a-f]{64}')"
          if [ -z "$digest" ]; then echo "::error::no digest for $IMAGE:$VERSION in the push output"; exit 1; fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The pull request is opened by a person from the link in the summary: GITHUB_TOKEN
      # can't open one here, and CI (which runs the new image) doesn't run on PRs it opens.
      - name: Pin the image in action.yml
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          BRANCH: pin-image-${{ inputs.version }}
        run: |
          line="  image: docker://$IMAGE:$VERSION@$DIGEST"
          sed -i -E "s|^  image: docker://.*$|$line|" action.yml
          grep -qxF "$line" action.yml || { echo "::error::could not update runs.image in action.yml"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "Pin the action to image $VERSION" -m "Published by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -q origin "$BRANCH"
          title="Pin the action to image $VERSION"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$BRANCH?quick_pull=1&title=$(jq -rn --arg t "$title" '$t|@uri')"
          {
            echo "### Published \`$IMAGE:$VERSION\`"
            echo '```yaml'
            echo "$line"
            echo '```'
            echo "Committed to \`action.yml\` on branch \`$BRANCH\`. **[Open the pull request]($url)**, merge it,"
            echo "then tag the merge commit \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
