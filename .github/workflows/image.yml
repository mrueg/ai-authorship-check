name: Publish image

# Builds the action image with the real model and pushes it to GHCR as
# ghcr.io/<repo>:<version>. Run it by hand before tagging a release; see
# "Releasing" in the README. It never overwrites an existing version, and git
# tags don't trigger it, so tagging the release can't replace the image that
# action.yml pins.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish, e.g. v0.2.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest # 16 GB RAM: enough to export ModernBERT-large
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists; publish a new version instead"; exit 1
          fi
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ./scripts/smoke.sh "$IMAGE@$DIGEST"
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published \`$IMAGE:$VERSION\`"
            echo "Set \`runs.image\` in \`action.yml\` to:"
            echo '```yaml'
            echo "  image: docker://$IMAGE:$VERSION@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
